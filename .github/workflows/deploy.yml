name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'hub/**'
      - 'aks/**'
      - 'database/**'
      - 'global.auto.tfvars'
      - 'deploy.sh'
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to deploy'
        required: true
        default: 'hub'
        type: choice
        options:
          - hub
          - aks
          - database
      environment:
        description: 'Environment (for aks/database)'
        required: false
        default: 'dev'
      location:
        description: 'Location short (e.g. weu)'
        required: false
        default: 'weu'
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gate applies behind a GitHub Environment with required reviewers -
    # configure a "production" environment under repo Settings > Environments
    # for that approval gate; plans run unattended.
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply') && 'production' || 'plan' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      # OIDC login - no client secret. One-time setup: create an Azure AD
      # app registration with a federated credential trusting this repo
      # (see README.md's "CI/CD Setup" section for the exact `az` commands),
      # then store its client/tenant/subscription IDs as the repo secrets
      # referenced below.
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Run Deploy Script
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          # If triggered via workflow_dispatch, use inputs. Otherwise default to 'hub plan'
          COMPONENT="${{ github.event.inputs.component || 'hub' }}"
          ACTION="${{ github.event.inputs.action || 'plan' }}"
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          LOC="${{ github.event.inputs.location || 'weu' }}"
          chmod +x ./deploy.sh
          ./deploy.sh "$COMPONENT" "$ACTION" "$ENV" "$LOC"
